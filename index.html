<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quin és el teu perfil professional?</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #06b6d4;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin: 1rem;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            background-color: #334155;
            color: var(--text);
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .btn:hover {
            background-color: #475569;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: var(--primary);
            text-align: center;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: transparent;
        }

        .hidden {
            display: none !important;
        }

        .result-card {
            background: #0f172a;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 1rem;
            border-left: 5px solid var(--accent);
        }

        .result-card h3 {
            color: var(--accent);
            margin-top: 0;
        }

        .tag {
            display: inline-block;
            background: #334155;
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 0.25rem 0.25rem 0.25rem 0;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Pantalla d'inici -->
        <div id="welcome-screen">
            <h1>Descobreix el teu Futur</h1>
            <p class="subtitle">Respon aquest test ràpid per trobar el teu perfil professional ideal i quins treballs s'adapten a tu.</p>
            <button class="btn btn-primary" onclick="startTest()">Començar el Test 🚀</button>
        </div>

        <!-- Pantalla de preguntes -->
        <div id="question-screen" class="hidden">
            <span id="question-progress" style="color: var(--text-muted); font-size: 0.85rem;"></span>
            <h2 id="question-text" style="font-size: 1.3rem; margin-top: 0.5rem; margin-bottom: 1.5rem;"></h2>
            <div id="answers-container"></div>
        </div>

        <!-- Pantalla de resultats -->
        <div id="result-screen" class="hidden">
            <h1>El teu Perfil Ideal 🎉</h1>
            <div id="result-content"></div>
            <button class="btn btn-primary" style="margin-top: 1.5rem;" onclick="restartTest()">Tornar a fer el test 🔄</button>
        </div>
    </div>

    <script>
        // Dades dels perfils
        const profiles = {
            tecnologic: { name: "El Tecnològic / Digital", desc: "T'agrada passar hores davant de la pantalla, provar programes nous, resoldre reptes lògics o jugar a videojocs pensant en com estan fets.", jobs: "Programador d'apps/videojocs, Ciberseguretat, Tècnic informàtic, IA." },
            creatiu: { name: "El Creatiu / Dissenyador", desc: "Dibuixar, editar vídeos per a xarxes, crear històries visuals, dissenyar roba o espais i expressar la teva imaginació.", jobs: "Dissenyador gràfic, Animador 3D, Il·lustrador, Editor de vídeo." },
            cientific: { name: "El Científic / Investigador", desc: "Fer experiments, preguntar-te el 'perquè' de tot, analitzar dades i investigar sobre la salut o la natura.", jobs: "Botecnòleg, Investigador de laboratori, Metge/Infermer, Farmacèutic." },
            social: { name: "El Social / Cuidador", desc: "Ajudar els companys, escoltar els altres, organitzar activitats i preocupar-te pel benestar de les persones.", jobs: "Educador infantil, Integrador social, Psicòleg, Treballador social." },
            emprenedor: { name: "L'Emprenedor / Negocis", desc: "Pensar idees de negoci, organitzar projectes en grup, liderar, negociar i entendre el món de les empreses.", jobs: "Fundador d'una startup, Màrqueting digital, Director de projectes." },
            tecnic: { name: "El Tècnic / Manetes", desc: "Reparar coses que es trenquen, muntar i desmuntar aparells, utilitzar eines i construir amb les mans.", jobs: "Mecànic, Instal·lador d'energia solar, Robòtica industrial, Electricista." },
            esportiu: { name: "L'Esportiu / Moviment", desc: "Practicar esports, moure't, estar a l'aire lliure, cuidar el teu cos i entrenar a altres persones.", jobs: "Entrenador personal, Fisioterapeuta, Instructor d'aventura, Preparador." },
            comunicador: { name: "El Comunicador / Portaveu", desc: "Parlar en públic, participar en debats, escriure, aprendre idiomes i explicar històries que enganxin.", jobs: "Periodista, Traductor, Relacions Públiques, Advocat, Copywriter." },
            mediambient: { name: "La Natura i Medi Ambient", desc: "Estar a la naturalesa, cuidar animals, protegir el medi ambient, reciclar i aprendre sobre els ecosistemes.", jobs: "Agent rural, Veterinari, Paisatgista, Tècnic en energies renovables." },
            organitzador: { name: "L'Organitzador / Projectes", desc: "Posar ordre en el caos, planificar horaris, fer llistes i coordinar que un treball en grup surti perfecte.", jobs: "Gestor de logística, Operador internacional, Organitzador d'esdeveniments." },
            hosteleria: { name: "L'Hosteleria i Turisme", desc: "Cuinar o provar plats nous, viatjar, conèixer cultures i fer que la gent s'ho passi bé.", jobs: "Xef de cuina, Director d'hotel, Guia turístic, Organitzador de viatges." },
            seguretat: { name: "Seguretat i Justícia", desc: "Fer complir les normes, defensar el que és just, protegir els altres davant del perill i ajudar en emergències.", jobs: "Policia / Mosso, Bomber, Tècnic d'emergències sanitàries (ambulàncies)." }
        };

        // Preguntes del test (assignen punts a perfils)
        const questions = [
            {
                text: "Què t'agrada més fer en el teu temps lliure?",
                answers: [
                    { text: "Jugar a videojocs, programar o investigar sobre tecnologia", profile: "tecnologic" },
                    { text: "Dibuixar, dissenyar coses o editar vídeos per a xarxes", profile: "creatiu" },
                    { text: "Fer esports, entrenar o moure't a l'aire lliure", profile: "esportiu" },
                    { text: "Llegir, escriure, parlar amb amics o debatre idees", profile: "comunicador" }
                ]
            },
            {
                text: "Quan teniu un treball en grup a classe, quin rol acostumes a agafar?",
                answers: [
                    { text: "Organitzar qui fa què, posar horaris i vigilar que tot surti a temps", profile: "organitzador" },
                    { text: "Ajudar a tothom, animar el grup i assegurar-me que tothom participa", profile: "social" },
                    { text: "Proposar idees boges, creatives i dissenyar la presentació", profile: "emprenedor" },
                    { text: "Arreglar la part tècnica, buscar dades lògiques o muntar el format digital", profile: "tecnologic" }
                ]
            },
            {
                text: "Quina assignatura o tema et crida més l'atenció?",
                answers: [
                    { text: "Ciències, biologia, fer experiments i entendre la natura", profile: "cientific" },
                    { text: "Tecnologia, tallers, mecànica o entendre com funcionen les màquines", profile: "tecnic" },
                    { text: "El medi ambient, els animals, la sostenibilitat i el planeta", profile: "mediambient" },
                    { text: "La justícia, les normes socials, la història i com funciona la societat", profile: "seguretat" }
                ]
            },
            {
                text: "Imagina un futur on viatges o organitzes experiències. Què t'agradaria més?",
                answers: [
                    { text: "Anar a hotels, tastar gastronomia de tot el món i organitzar viatges", profile: "hosteleria" },
                    { text: "Resoldre problemes d'emergència, protegir persones o fer complir la llei", profile: "seguretat" },
                    { text: "Crear un negoci propi, una startup o gestionar projectes innovadors", profile: "emprenedor" },
                    { text: "Explicar històries al món a través de idiomes, periodisme o contingut", profile: "comunicador" }
                ]
            }
        ];

        let currentQuestion = 0;
        let scores = {};

        function startTest() {
            currentQuestion = 0;
            scores = {};
            Object.keys(profiles).forEach(p => scores[p] = 0);
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-progress').innerText = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
            document.getElementById('question-text').innerText = q.text;
            
            const container = document.getElementById('answers-container');
            container.innerHTML = '';
            
            q.answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = ans.text;
                btn.onclick = () => selectAnswer(ans.profile);
                container.appendChild(btn);
            });
        }

        function selectAnswer(profile) {
            scores[profile] = (scores[profile] || 0) + 1;
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            // Trobar el perfil amb més puntuació
            let bestProfile = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            let pData = profiles[bestProfile];

            const content = document.getElementById('result-content');
            content.innerHTML = `
                <div class="result-card">
                    <h3>${pData.name}</h3>
                    <p><strong>Què t'agrada fer:</strong> ${pData.desc}</p>
                    <p><strong>Treballs concrets:</strong> <span class="tag">${pData.jobs.replaceAll(', ', '</span> <span class="tag">')}</span></p>
                </div>
            `;
        }

        function restartTest() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
